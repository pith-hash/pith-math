[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pith-math"
version = "0.1.0"
description = "FFT, DCT-II, median and 3x3 linear algebra SDK via the pith-math Rust cdylib (ctypes, zero-dep)"
license = "MIT"
requires-python = ">=3.9"
keywords = ["fft", "dct", "median", "linear-algebra", "hashing"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Repository = "https://github.com/pith-hash/pith-math"
Homepage = "https://github.com/pith-hash/pith-math"

[tool.setuptools]
packages = ["pith_math"]

[tool.setuptools.package-data]
pith_math = ["*.dll", "*.dylib", "*.so"]
